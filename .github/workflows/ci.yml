name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE) { throw 'SDK setup failed' }
      - name: Tests
        run: ./scripts/test.ps1
      - name: Windows application
        run: ./source/build-desktop.ps1
      - name: Development APK
        run: ./source/build-android.ps1 -BuildTools "$env:ANDROID_HOME/build-tools/35.0.0" -AndroidJar "$env:ANDROID_HOME/platforms/android-35/android.jar"
      - name: Verified dependencies
        run: ./scripts/fetch-tools.ps1
      - name: Package safety regression
        run: ./scripts/test-package.ps1
      - name: Package
        run: ./scripts/package.ps1 -Development
      - uses: actions/upload-artifact@v4
        with:
          name: XiaomiDesk-development-build
          path: |
            .build/XiaomiDesk-*-Windows11-x64.zip
            .build/XiaomiDesk-*-Windows11-x64.zip.sha256
          if-no-files-found: error
