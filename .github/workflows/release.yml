name: Draft beta release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE) { throw 'SDK setup failed' }
      - run: ./scripts/test.ps1
      - run: ./source/build-desktop.ps1
      - name: Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          XIAOMIDESK_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if (!$env:KEYSTORE_BASE64 -or !$env:XIAOMIDESK_SIGNING_PASSWORD) { throw 'Configure Android signing secrets first' }
          $key = Join-Path $env:RUNNER_TEMP 'xiaomidesk-release.p12'
          try {
            [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
            ./source/build-android.ps1 -Release -SigningKey $key -BuildTools "$env:ANDROID_HOME/build-tools/35.0.0" -AndroidJar "$env:ANDROID_HOME/platforms/android-35/android.jar"
          } finally {
            if (Test-Path -LiteralPath $key) { Remove-Item -LiteralPath $key }
          }
      - run: ./scripts/fetch-tools.ps1
      - run: ./scripts/package.ps1
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(-[a-z0-9.]+)?$') { throw 'Invalid version' }
          $archive = ".build/XiaomiDesk-$version-Windows11-x64.zip"
          gh release create "v$version" $archive "$archive.sha256" --draft --prerelease --target $env:GITHUB_SHA --title "XiaomiDesk $version" --notes-file docs/RELEASE-NOTES.md
          if ($LASTEXITCODE) { throw 'Draft release failed' }
